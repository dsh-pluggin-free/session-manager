  <path d="M0 250 C 220 180, 430 300, 660 220 S 1010 120, 1200 190" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>

  <g transform="translate(72 66)">
    <rect width="62" height="62" rx="18" fill="#4d6bfe" filter="url(#glow)"/>
    <path d="M18 23h26M25 23v-3h12v3M22 23l1.7 24h14.6L40 23M29 30v11M35 30v11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="178" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5">DSH Session Manager</text>
  <text x="74" y="218" fill="#a9b6d6" font-family="Segoe UI, Arial, sans-serif" font-size="21">会话回收站 · 多选批量删除 · 折叠与恢复</text>

